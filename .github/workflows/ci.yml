name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile plugin sources
        run: python -m compileall -q plugins.v2 plugins.v3

      - name: Validate market indexes and version gate
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          for name in ("package.v2.json", "package.v3.json"):
              json.loads(Path(name).read_text(encoding="utf-8"))
              print(f"{name}: valid JSON")
          EOF
          python .github/scripts/check_plugin_versions.py package.v2.json package.v3.json

      - name: Run contract tests
        run: |
          python -m pip install --disable-pip-version-check pytest pydantic
          python -m pytest tests/ -q

  p123sync-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend.v2/p123sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend.v2/p123sync/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
